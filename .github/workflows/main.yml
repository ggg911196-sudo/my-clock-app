name: Build APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip libtool autoconf cmake gettext \
          libncurses5-dev libncursesw5-dev zlib1g-dev \
          libffi-dev libssl-dev pkg-config ant
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer wheel

    - name: Build APK
      run: |
        # حذف فایل‌های موقت قدیمی برای جلوگیری از تداخل
        rm -rf .buildozer
        # شروع ساخت با جزئیات کامل
        buildozer -v android debug
      env:
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app
        path: bin/*.apk
